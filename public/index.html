<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沐沐的小屋</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background:linear-gradient(135deg,#ff9a9e,#fad0c4); height:100vh; display:flex; align-items:center; justify-content:center; }
#login { background:#fff; padding:40px; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,.15); text-align:center; }
#login h1 { color:#ff6b81; margin-bottom:8px; }
#login p { color:#999; margin-bottom:20px; }
#login input { padding:12px 16px; border:2px solid #f0f0f0; border-radius:30px; font-size:16px; outline:none; width:250px; }
#login button { margin-top:16px; padding:12px 40px; border:none; border-radius:30px; background:linear-gradient(135deg,#ff6b81,#ff8e53); color:#fff; font-size:16px; cursor:pointer; }
#login button:hover { opacity:.9; }
#chat { display:none; width:92%; max-width:700px; height:88vh; background:#fff; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,.15); overflow:hidden; flex-direction:column; }
header { background:linear-gradient(135deg,#ff6b81,#ff8e53); color:#fff; padding:16px 20px; display:flex; align-items:center; gap:10px; }
header .dot { width:40px; height:40px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; font-size:20px; }
header h2 { font-size:18px; }
header small { opacity:.85; display:block; font-weight:normal; }
#messages { flex:1; overflow-y:auto; padding:16px; background:#fafafa; }
.msg { margin-bottom:12px; display:flex; flex-direction:column; }
.msg .bubble { max-width:70%; padding:10px 14px; border-radius:16px; font-size:15px; line-height:1.5; word-wrap:break-word; }
.msg.me { align-items:flex-end; }
.msg.me .bubble { background:linear-gradient(135deg,#ff6b81,#ff8e53); color:#fff; border-bottom-right-radius:4px; }
.msg.other { align-items:flex-start; }
.msg.other .bubble { background:#fff; color:#333; box-shadow:0 1px 4px rgba(0,0,0,.08); border-bottom-left-radius:4px; }
.msg .name { font-size:12px; color:#999; margin:0 4px 3px; }
.msg .time { font-size:11px; color:#bbb; margin-top:3px; }
.msg.ai .bubble { background:#fff7e6; border:1px solid #ffe1a8; color:#8a5a00; }
.msg.ai .name { color:#ff8e53; }
.system { text-align:center; color:#bbb; font-size:12px; margin:10px 0; }
#typing { padding:0 16px 6px; color:#ff8e53; font-size:13px; min-height:20px; }
footer { display:flex; padding:10px; border-top:1px solid #f0f0f0; gap:8px; background:#fff; }
footer input { flex:1; padding:12px 16px; border:2px solid #f0f0f0; border-radius:30px; font-size:15px; outline:none; }
footer input:focus { border-color:#ff6b81; }
footer button { padding:0 24px; border:none; border-radius:30px; background:linear-gradient(135deg,#ff6b81,#ff8e53); color:#fff; font-size:16px; cursor:pointer; }
</style>
</head>
<body>

<div id="login">
  <h1>💬 沐沐的小屋</h1>
  <p>输入昵称，进来和朋友还有我聊天</p>
  <input id="nick" placeholder="你的昵称" maxlength="12">
  <br>
  <button onclick="join()">进 来</button>
</div>

<div id="chat">
  <header>
    <div class="dot">💬</div>
    <div>
      <h2 id="roomName">沐沐的小屋</h2>
      <small>@沐沐 可以唤我说话</small>
    </div>
  </header>
  <div id="messages"></div>
  <div id="typing"></div>
  <footer>
    <input id="input" placeholder="说点什么… @沐沐 跟我聊" onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">发送</button>
  </footer>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
let socket, myName = '';
function join() {
  myName = document.getElementById('nick').value.trim() || '游客';
  document.getElementById('login').style.display = 'none';
  document.getElementById('chat').style.display = 'flex';
  socket = io();
  socket.emit('join', myName);
  socket.on('history', (msgs) => { msgs.forEach(m => render(m)); });
  socket.on('message', (m) => render(m));
  socket.on('system', (t) => addSystem(t));
  socket.on('typing', (t) => {
    document.getElementById('typing').textContent = t.typing ? t.name + ' 正在输入…' : '';
  });
}
function render(m) {
  const box = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + (m.name === myName ? 'me' : 'other') + (m.type === 'ai' ? ' ai' : '');
  const t = new Date(m.time).toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
  div.innerHTML = '<span class="name">' + m.name + '</span><div class="bubble">' + esc(m.text) + '</div><span class="time">' + t + '</span>';
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}
function addSystem(t) {
  const box = document.getElementById('messages');
  const d = document.createElement('div');
  d.className = 'system'; d.textContent = t;
  box.appendChild(d); box.scrollTop = box.scrollHeight;
}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function send() {
  const inp = document.getElementById('input');
  const text = inp.value.trim();
  if (!text || !socket) return;
  const toAI = text.includes('沐沐');
  socket.emit('message', { text, toAI });
  inp.value = '';
}
</script>
</body>
</html>
